name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GeekShopping.sln

      - name: Build
        run: dotnet build GeekShopping.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test GeekShopping.sln --no-build --configuration Release --verbosity normal
